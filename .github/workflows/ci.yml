name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SQLite blocker
        run: pnpm check:sqlite

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test:quality

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost/danielou_ci
          DIRECT_URL: postgresql://placeholder:placeholder@localhost/danielou_ci
          AUTH_SECRET: ci-secret-minimum-32-characters-long-enough
          BETTER_AUTH_SECRET: ci-secret-minimum-32-characters-long-enough
          BETTER_AUTH_URL: http://localhost:3000

  db-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: danielou_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/danielou_ci
        run: node -e "
          const { Client } = require('pg');
          const fs = require('fs');
          const path = require('path');
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const dir = 'drizzle';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.sql')).sort();
            for (const f of files) {
              const sql = fs.readFileSync(path.join(dir, f), 'utf8');
              await client.query(sql);
              console.log('Applied: ' + f);
            }
            await client.end();
            console.log('All migrations applied (' + files.length + ' files)');
          })().catch(e => { console.error(e.message); process.exit(1); });
        "

      - name: DB integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/danielou_ci
        run: pnpm test:db-integration
